name: Demo health monitor

on:
  schedule:
    # Nightly at 10:00 UTC (6am ET)
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check demo URLs
        run: node scripts/check-demos.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: kwessman@gmail.com
